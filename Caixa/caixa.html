<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>CAIXA LIVRE</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .topo {
            background-color: #ffc107;
            text-align: center;
            font-size: 42px;
            font-weight: bold;
            border: 4px solid #01026b;
            padding: 15px;
        }

        .painel {
            background-color: #7d8686;
            padding: 10px;
            margin-bottom: 10px;
            color: white;
        }
    </style>
</head>

<body class="bg-primary bg-gradient">

    <div id="Alert"><br></div>

    <div class="container mt-3">
        <div class="topo">CAIXA LIVRE</div>

        <div class="row mt-3">

            <div class="col-md-7">
                <h3 class="text-white">
                    <span class="badge text-bg-primary">SUA COMPRA</span>
                </h3>
                <ul id="lista" class="list-group"></ul>
            </div>

            <div class="col-md-5">

                <div class="painel">
                    Total: R$ <span id="Total">0.00</span>
                </div>

                <div class="painel">
                    <label>Código de Barras</label>
                    <input type="text" id="cod" class="form-control">
                </div>

                <div class="painel">
                    <label>Quantidade</label>
                    <input type="number" id="qtd" class="form-control" value="1">
                </div>

                <div class="painel">
                    <label>Quantidade x Valor</label>
                    <div class="alert alert-light" role="alert">
                        <span id="qtdxvl">0.00</span>
                    </div>
                </div>

                <button class="btn btn-success w-100" onclick="addProduto()">
                    Adicionar Produto
                </button>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Seu script -->
    <script src="script.js"></script>

</body>
</html>
