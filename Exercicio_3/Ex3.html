<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média Escolar</title>
    <link rel="stylesheet" href="Ex3.css">
</head>

<body>

    <div class="container">

        <h1> Média Escolar</h1>

        <div class="campo">
            <label for="nome">Nome do Aluno</label>
            <input type="text" id="nome" placeholder="Digite o nome do aluno">
        </div>

        <div class="campo">
            <label for="nota1">Nota 1</label>
            <input type="number" id="nota1" min="0" max="10" step="0.1">
        </div>

        <div class="campo">
            <label for="nota2">Nota 2</label>
            <input type="number" id="nota2" min="0" max="10" step="0.1">
        </div>

        <div class="campo">
            <label for="nota3">Nota 3</label>
            <input type="number" id="nota3" min="0" max="10" step="0.1">
        </div>

        <button id="calcularBtn">
            Calcular Média
        </button>

        <div id="resultado"></div>

    </div>

    <script src="Ex3.js"></script>

</body>

</html>
