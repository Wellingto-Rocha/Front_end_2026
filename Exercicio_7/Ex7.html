<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Security Validator</title>
    <link rel="stylesheet" href="Ex7.css">
</head>

<body>

    <div class="container">

        <h1>Infinity Card Guard</h1>

        <p class="subtitulo">
            Validador de Segurança Financeira
        </p>

        <div class="campo">
            <label>Número do Cartão</label>

            <input
                type="text"
                id="cartao"
                maxlength="19"
                placeholder="Digite até 16 dígitos">
        </div>

        <button id="analisarBtn">
            Analisar Cartão
        </button>

        <div id="painel"></div>

    </div>

    <script src="Ex7.js"></script>

</body>

</html>
