<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Bank - Simulador de Vendas</title>
    <link rel="stylesheet" href="Ex4.css">
</head>

<body>

    <div class="container">

        <h1>Infinity Bank</h1>
        <p class="subtitulo">Simulador de Vendas</p>

        <div class="campo">
            <label for="bandeira">Bandeira do Cartão</label>

            <select id="bandeira">
                <option value="">Selecione</option>
                <option value="visa">Visa</option>
                <option value="master">MasterCard</option>
                <option value="elo">Elo</option>
            </select>
        </div>

        <div class="campo">
            <label for="valor">Valor da Venda (R$)</label>
            <input type="number" id="valor" placeholder="Ex: 1000">
        </div>

        <div class="campo">
            <label for="parcelas">Quantidade de Parcelas</label>
            <input type="number" id="parcelas" min="1" max="24" placeholder="Ex: 10">
        </div>

        <button id="calcularBtn">
            Simular Venda
        </button>

        <div id="resultado"></div>

    </div>

    <script src="Ex4.js"></script>

</body>

</html>
